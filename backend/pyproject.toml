[project]
name = "strix1-backend"
version = "0.1.0"
description = "STRIX-1 Raspberry Pi 5 AI-assisted aerial sensing and ground-station backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
